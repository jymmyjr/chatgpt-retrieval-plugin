name: JYMMY V6 Parallel Secure Stems

on:
  push:
    branches:
      - jymmy-v6-secure-worker-20260809
    paths:
      - '.github/workflows/jymmy-v6-parallel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  parallel-stem:
    strategy:
      fail-fast: false
      matrix:
        idx: ['03','04','05','06']
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jymmy-v6-secure-worker-20260809
          fetch-depth: 1

      - name: Generate per-stem secure handshake
        shell: bash
        run: |
          set -euo pipefail
          IDX='${{ matrix.idx }}'
          git config user.name "JYMMY Parallel Audio Worker"
          git config user.email "actions@github.com"
          mkdir -p .secure HANDSHAKE SECURE_OUTPUT inputs separated
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out ".secure/runner_${IDX}_private.pem" >/dev/null 2>&1
          openssl pkey -in ".secure/runner_${IDX}_private.pem" -pubout -out "HANDSHAKE/parallel_${IDX}.pem" >/dev/null 2>&1
          cat > .secure/output_public.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAija3C01qa7I79dcRCZfW
          y7urZ5T1g2W3VoB5PlrlLnKE7LOUunvtUHZbRvWZ1bjmulvZvJo2BA7hiHq7I5Hj
          Fn4DgcFRayeh7LSpLCVKVKKkoJpck94lel23lrXs7buNM9mOhXyMDH+fY/rSefEL
          +2y1/0a7Cz1qCISNTg4apImHVjvCLX92KVmQ6o5g3udFZnv/B9OAgLPJYqO90WXo
          W9IPMM2QMZfrTR4IiwB21kItKxNH2xL/LDzj6srFmi/uc0VyVYXkyNcNWGX6uunE
          sQLtZk33LM67mI/NC/k4T4klcYjeP3BDYcaEtOsUw57LZchzwar8ANoqvA9acmTN
          lIO4AP5qCxdcjzfrRcEbN52Qa02mhNEuDp+6/ZXFjGJvzKo7FXdB3HxlO5f6u6L2
          t6KqB397eB17cC9gj4Co/4RoAEreqie0+7NCvsunb82623b1aAU/AJzXG/fI8Za8
          4ilo1LZQY43Hh3ebY8pCjnfZ/RjCI2nXJI3lx5h56LgwIODImke63QFQO4++roQz
          s32CfcFnaSRSC/DBTMoKbbD99W7Tsyj05QJcLuTDc98GFlsLnOYlAplkWzd4/wTl
          JIKYEZMq5rvMDXnlRrNwtzhbTym3R/Bub97dVNb9YHeiY+JMhRYZrwZAknYjQHOC
          7nJcpKZhzNKaLYALjbN07N0CAwEAAQ==
          -----END PUBLIC KEY-----
          EOF
          sed -i 's/^          //' .secure/output_public.pem
          git add "HANDSHAKE/parallel_${IDX}.pem"
          git commit -m "Parallel secure handshake ${IDX}"
          for TRY in 1 2 3 4 5; do
            git fetch -q origin jymmy-v6-secure-worker-20260809
            if git rebase origin/jymmy-v6-secure-worker-20260809 && git push origin HEAD:jymmy-v6-secure-worker-20260809; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((TRY*2))
          done
          exit 1

      - name: Wait for encrypted per-stem input
        shell: bash
        run: |
          set -euo pipefail
          IDX='${{ matrix.idx }}'
          FOUND=0
          for i in $(seq 1 240); do
            git fetch -q origin jymmy-v6-secure-worker-20260809
            if git cat-file -e "origin/jymmy-v6-secure-worker-20260809:SECURE_INPUT/parallel_${IDX}.rsa" 2>/dev/null; then
              git show "origin/jymmy-v6-secure-worker-20260809:SECURE_INPUT/parallel_${IDX}.rsa" > ".secure/parallel_${IDX}.rsa"
              FOUND=1
              break
            fi
            sleep 5
          done
          test "$FOUND" -eq 1
          openssl pkeyutl -decrypt \
            -inkey ".secure/runner_${IDX}_private.pem" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -in ".secure/parallel_${IDX}.rsa" \
            -out ".secure/id_${IDX}.txt"
          test -s ".secure/id_${IDX}.txt"

      - name: Install neural stack
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install 'demucs==4.0.1' gdown torchcodec

      - name: Separate and encrypt one stem
        env:
          TORCH_HOME: ${{ github.workspace }}/.torch
        shell: bash
        run: |
          set -euo pipefail
          IDX='${{ matrix.idx }}'
          git fetch -q origin jymmy-v6-secure-worker-20260809
          if git cat-file -e "origin/jymmy-v6-secure-worker-20260809:SECURE_OUTPUT/stem_${IDX}.flac.enc" 2>/dev/null; then
            echo "Stem ${IDX} already exists; no duplicate inference."
            exit 0
          fi

          FID="$(tr -d '\r\n' < ".secure/id_${IDX}.txt")"
          INPUT="inputs/source_${IDX}.m4a"
          python - "$FID" "$INPUT" </dev/null <<'PY'
          import gdown, os, sys
          fid, out = sys.argv[1], sys.argv[2]
          r = gdown.download(id=fid, output=out, quiet=False)
          if not r or not os.path.exists(out) or os.path.getsize(out) == 0:
              raise SystemExit('Drive download failed')
          PY

          python -m demucs --two-stems=vocals -n htdemucs_ft --flac --clip-mode rescale -o separated "$INPUT" </dev/null
          FOUND="$(find separated/htdemucs_ft -type f -path "*/source_${IDX}/vocals.flac" -print -quit)"
          test -n "$FOUND"
          PLAIN=".secure/stem_${IDX}.flac"
          cp "$FOUND" "$PLAIN"

          KEYBIN=".secure/key_${IDX}.bin"
          openssl rand 32 > "$KEYBIN"
          IVHEX="$(openssl rand -hex 16)"
          KEYHEX="$(xxd -p -c 256 "$KEYBIN")"
          openssl enc -aes-256-cbc -K "$KEYHEX" -iv "$IVHEX" -in "$PLAIN" -out "SECURE_OUTPUT/stem_${IDX}.flac.enc"
          printf '%s\n' "$IVHEX" > "SECURE_OUTPUT/stem_${IDX}.iv"
          openssl pkeyutl -encrypt -pubin -inkey .secure/output_public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$KEYBIN" -out "SECURE_OUTPUT/stem_${IDX}.key.rsa"

          printf 'index=%s\n' "$IDX" > ".secure/audit_${IDX}.txt"
          ffprobe -v error -show_entries format=duration,size,bit_rate -show_entries stream=codec_name,sample_rate,channels,bits_per_raw_sample -of default=nw=1 "$PLAIN" >> ".secure/audit_${IDX}.txt"
          sha256sum "$PLAIN" >> ".secure/audit_${IDX}.txt"
          sha256sum "SECURE_OUTPUT/stem_${IDX}.flac.enc" >> ".secure/audit_${IDX}.txt"
          AUDKEY=".secure/audit_key_${IDX}.bin"
          openssl rand 32 > "$AUDKEY"
          AUDIVHEX="$(openssl rand -hex 16)"
          AUDKEYHEX="$(xxd -p -c 256 "$AUDKEY")"
          openssl enc -aes-256-cbc -K "$AUDKEYHEX" -iv "$AUDIVHEX" -in ".secure/audit_${IDX}.txt" -out "SECURE_OUTPUT/audit_${IDX}.txt.enc"
          printf '%s\n' "$AUDIVHEX" > "SECURE_OUTPUT/audit_${IDX}.iv"
          openssl pkeyutl -encrypt -pubin -inkey .secure/output_public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in "$AUDKEY" -out "SECURE_OUTPUT/audit_${IDX}.key.rsa"

          git add "SECURE_OUTPUT/stem_${IDX}.flac.enc" "SECURE_OUTPUT/stem_${IDX}.key.rsa" "SECURE_OUTPUT/stem_${IDX}.iv" "SECURE_OUTPUT/audit_${IDX}.txt.enc" "SECURE_OUTPUT/audit_${IDX}.key.rsa" "SECURE_OUTPUT/audit_${IDX}.iv"
          git commit -m "Persist parallel encrypted V6 stem ${IDX}"
          for TRY in 1 2 3 4 5; do
            git fetch -q origin jymmy-v6-secure-worker-20260809
            if git rebase origin/jymmy-v6-secure-worker-20260809 && git push origin HEAD:jymmy-v6-secure-worker-20260809; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((TRY*2))
          done
          exit 1
